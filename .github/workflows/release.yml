name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          cargo binstall tauri-cli --version "^2" --no-confirm --locked
          if ($LASTEXITCODE -ne 0) { cargo install tauri-cli --version "^2" --locked }

      - name: Build installer
        run: cargo tauri build

      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $installer.FullName DOKIII-Setup.exe

      - name: Build setup wizard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/src-tauri/payload | Out-Null
          Copy-Item DOKIII-Setup.exe installer/src-tauri/payload/DOKIII-Setup.exe
          Push-Location installer/src-tauri
          cargo tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item installer/src-tauri/target/release/dokiii-installer.exe DOKIII-Installer.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokiii-installer
          path: |
            DOKIII-Installer.exe
            DOKIII-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag DOKIII-Installer.exe DOKIII-Setup.exe --clobber
          } else {
            gh release create $tag DOKIII-Installer.exe DOKIII-Setup.exe --title "DOKIII $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
