<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOKIII Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <canvas id="stars"></canvas>
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="vignette"></div>
  </div>

  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar-brand" data-tauri-drag-region>
      <img src="logo.png" alt="" draggable="false" />
      <span data-tauri-drag-region>DOKIII Setup</span>
    </div>
    <div class="titlebar-buttons">
      <button id="btn-min" aria-label="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1" fill="none" /></svg>
      </button>
      <button id="btn-close" class="close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1" fill="none" /></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="hero">
      <div class="mark"><img src="logo.png" alt="" draggable="false" /></div>
      <h1>DOKIII</h1>
      <p class="tagline">A macOS-style dock, floating music player and desktop widgets for Windows.</p>
      <div class="mini-dock" id="mini-dock"></div>
    </section>

    <section class="panel" id="panel" data-state="welcome">
      <div class="panel-head">
        <span class="eyebrow" id="eyebrow">Setup</span>
        <h2 id="title">Install DOKIII</h2>
        <p class="lead" id="lead"></p>
      </div>

      <div class="view view-welcome">
        <span class="field-label">Install location</span>
        <div class="path-box">
          <span class="path" id="path" title=""></span>
          <button class="link" id="btn-change">Change</button>
        </div>

        <div class="options">
          <label class="option">
            <span class="option-text">
              <span class="option-name">Desktop shortcut</span>
              <span class="option-desc">Add DOKIII to your desktop</span>
            </span>
            <input type="checkbox" id="shortcut" checked />
            <span class="switch"><span class="knob"></span></span>
          </label>
          <label class="option">
            <span class="option-text">
              <span class="option-name">Launch when finished</span>
              <span class="option-desc">Start the dock right after setup</span>
            </span>
            <input type="checkbox" id="autolaunch" checked />
            <span class="switch"><span class="knob"></span></span>
          </label>
        </div>

        <button class="btn primary wide" id="btn-install">Install</button>
        <p class="foot"><span id="version"></span><span class="dot"></span><span>No administrator needed</span></p>
      </div>

      <div class="view view-progress">
        <ol class="steps">
          <li class="step" data-step="0"><span class="step-mark"></span><span>Preparing</span></li>
          <li class="step" data-step="1"><span class="step-mark"></span><span>Installing</span></li>
          <li class="step" data-step="2"><span class="step-mark"></span><span>Finishing up</span></li>
        </ol>
        <div class="progress"><div class="bar"></div></div>
      </div>

      <div class="view view-done">
        <div class="badge ok">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        </div>
        <div class="button-row">
          <button class="btn ghost" id="btn-finish">Close</button>
          <button class="btn primary" id="btn-launch">Launch DOKIII</button>
        </div>
      </div>

      <div class="view view-error">
        <p class="error-text" id="error-text"></p>
        <div class="button-row">
          <button class="btn ghost" id="btn-error-close">Close</button>
          <button class="btn primary" id="btn-retry">Try again</button>
        </div>
      </div>
    </section>
  </main>

  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
